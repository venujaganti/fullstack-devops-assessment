
  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare EC2 deployment directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            mkdir -p "${{ secrets.EC2_APP_DIR }}"

      - name: Copy compose and deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,deploy/deploy-remote.sh"
          target: ${{ secrets.EC2_APP_DIR }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_DIR: ${{ secrets.EC2_APP_DIR }}

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: APP_ENV_FILE,IMAGE_TAG,GHCR_OWNER,GHCR_USER,GHCR_TOKEN,APP_DIR
          script: |
            set -e

            cd "$APP_DIR"

            echo "Starting deployment..."

            printf '%s' "$APP_ENV_FILE" > .env
            chmod 600 .env

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            chmod +x deploy/deploy-remote.sh

            ./deploy/deploy-remote.sh

            echo "Deployment completed successfully."
